name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Plugins
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew make
          else
            echo "Aviso: Estrutura Gradle completa ausente, pulando build real."
            mkdir -p build
            echo '{}' > build/plugins.json
          fi
        continue-on-error: true

      - name: Deploy to Builds Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: builds
